version: '3.8'
services:
  # --- Frontend: Development Profile ---
  frontend-dev:
    container_name: wander-frontend-dev
    build:
      context: ./wander-sync-frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"  # Adjust depending on dev server port
    environment:
      - NODE_ENV=development
    profiles: [dev]
    restart: unless-stopped

  # --- Frontend: Production Profile ---
  frontend-prod:
    container_name: wander-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    profiles: [prod]
    restart: unless-stopped

#docker-compose --profile dev up --build
#docker-compose --profile prod up --build